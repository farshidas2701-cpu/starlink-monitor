def open_simple_radar(e):
    # یه رادار ساده با دایره‌های متحدالمرکز
    page.controls.clear()
    page.add(
        ft.Column([
            ft.Text("🗺️ رادار ساده", size=20, weight=ft.FontWeight.BOLD),
            ft.Container(
                content=ft.Stack([
                    ft.Container(width=200, height=200, border=ft.border.all(1, "green"), border_radius=100),
                    ft.Container(width=140, height=140, border=ft.border.all(1, "green"), border_radius=70),
                    ft.Container(width=80, height=80, border=ft.border.all(1, "green"), border_radius=40),
                    ft.Container(content=ft.Text("🎯", size=20), alignment=ft.Alignment(0, 0))
                ]),
                width=200, height=200
            ),
            ft.ElevatedButton("بازگشت", on_click=lambda e: show_dashboard())
        ], alignment=ft.MainAxisAlignment.CENTER, horizontal_alignment=ft.CrossAxisAlignment.CENTER)
    )
    page.update()

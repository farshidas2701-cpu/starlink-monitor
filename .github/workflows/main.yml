def main(page: ft.Page):
    page.title = "سامانه پایش"
    page.theme_mode = ft.ThemeMode.DARK
    page.rtl = True
    page.padding = 20
    page.bgcolor = "#1a1a2e"
    page.window_maximized = False
    
    show_splash(page)

ft.app(target=main)

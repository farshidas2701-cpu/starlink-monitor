def show_map_page(page):
    page.controls.clear()
    page.bgcolor = "#1a1a2e"
    
    neshan_url = f"https://nshn.ir/map?key={NESHAN_API_KEY}"
    
    def open_neshan(e):
        link_dialog = ft.AlertDialog(
            title=ft.Text("🗺️ نقشه نشان", size=18, weight=ft.FontWeight.BOLD, color="#4CAF50"),
            content=ft.Container(
                content=ft.Column([
                    ft.Text("لینک نقشه نشان:", size=14, color="white"),
                    ft.Text(neshan_url, size=12, color="#4DD0E1", selectable=True),
                    ft.Text("لینک را کپی کنید و در مرورگر باز کنید", size=12, color="#888888"),
                ], spacing=10),
                width=350,
                padding=15
            ),
            actions=[
                ft.TextButton("کپی لینک", on_click=lambda e: copy_link(page, neshan_url)),
                ft.TextButton("بستن", on_click=lambda e: close_dialog(page, link_dialog))
            ]
        )
        page.overlay.append(link_dialog)
        link_dialog.open = True
        page.update()
    
    def copy_link(page, url):
        page.set_clipboard(url)
        show_toast(page, "✅ لینک کپی شد!")
    
    page.add(
        ft.Container(
            content=ft.Column([
                ft.Text("🗺️ نقشه", size=24, weight=ft.FontWeight.BOLD, color="#4CAF50"),
                ft.Text("نقشه ایران (سرویس نشان)", size=14, color="#888888"),
                ft.Container(
                    content=ft.Column([
                        ft.Text("📍", size=50),
                        ft.Text("نقشه ایران", size=16, weight=ft.FontWeight.BOLD, color="white"),
                        ft.Text("برای دریافت لینک نقشه کلیک کنید", size=12, color="#888888"),
                    ], horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=10),
                    padding=20,
                    bgcolor="#2a2a3e",
                    border_radius=12,
                    border=ft.Border(left=ft.BorderSide(2, "#4CAF50"), top=ft.BorderSide(2, "#4CAF50"), right=ft.BorderSide(2, "#4CAF50"), bottom=ft.BorderSide(2, "#4CAF50")),
                    width=300,
                    height=200,
                    on_click=open_neshan
                ),
                ft.ElevatedButton("🗺️ نقشه نشان", on_click=open_neshan, bgcolor="#2E7D32", color="white", width=200),
                ft.ElevatedButton("🌍 نقشه جهانی (OpenStreetMap)", on_click=open_osm, bgcolor="#0D47A1", color="white", width=200),
                ft.ElevatedButton("🔙 بازگشت", on_click=lambda e: show_dashboard(page, "کاربر ۱", "کاربر"), bgcolor="#424242", color="white", width=200)
            ], alignment=ft.MainAxisAlignment.CENTER, horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=15),
            expand=True
        )
    )
    page.update()


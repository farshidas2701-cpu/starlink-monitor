# ===== تاریخ شمسی =====
def get_now_shamsi():
    now = datetime.now()
    return f"{now.year}/{now.month:02d}/{now.day:02d} - {now.strftime('%H:%M:%S')}"

# ===== توابع کمکی =====
def show_toast(page, msg):
    page.snack_bar = ft.SnackBar(ft.Text(msg, color="white"), bgcolor="#333333")
    page.snack_bar.open = True
    page.update()

def close_dialog(page, dialog):
    dialog.open = False
    page.update()


# ===== صفحه ورود =====
# ============================================================
def show_login(page):
    page.controls.clear()
    page.bgcolor = "#1a1a2e"
    
    user_pass = ft.TextField(label="رمز عبور", password=True, can_reveal_password=True, width=180, border_color="#4DD0E1", bgcolor="#2a2a3e", color="white", height=40)
    admin_pass = ft.TextField(label="رمز عبور", password=True, can_reveal_password=True, width=180, border_color="#FFB74D", bgcolor="#2a2a3e", color="white", height=40)
    
    def login_user(e):
        if user_pass.value == user_data["user_pin"]:
            show_dashboard(page, "کاربر ۱", "کاربر")
        else:
            show_toast(page, "❌ رمز عبور اشتباه است")
    
    def login_admin(e):
        if admin_pass.value == user_data["admin_pin"]:
            show_dashboard(page, "ادمین", "ادمین")
        else:
            show_toast(page, "❌ رمز عبور اشتباه است")
    
    user_card = ft.Container(
        content=ft.Column([
            ft.Text("👤 ورود کاربران", size=16, weight=ft.FontWeight.BOLD, color="#4DD0E1"),
            user_pass,
            ft.ElevatedButton("ورود", on_click=login_user, bgcolor="#0D47A1", color="white", width=180, height=35)
        ], horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=8),
        padding=15, bgcolor="#2a2a3e", border_radius=10,
        border=ft.Border(left=ft.BorderSide(2, "#4DD0E1"), top=ft.BorderSide(2, "#4DD0E1"), right=ft.BorderSide(2, "#4DD0E1"), bottom=ft.BorderSide(2, "#4DD0E1")),
        width=220
    )
    
    admin_card = ft.Container(
        content=ft.Column([
            ft.Text("👑 ورود ادمین", size=16, weight=ft.FontWeight.BOLD, color="#FFB74D"),
            admin_pass,
            ft.ElevatedButton("ورود", on_click=login_admin, bgcolor="#E65100", color="white", width=180, height=35)
        ], horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=8),
        padding=15, bgcolor="#2a2a3e", border_radius=10,
        border=ft.Border(left=ft.BorderSide(2, "#FFB74D"), top=ft.BorderSide(2, "#FFB74D"), right=ft.BorderSide(2, "#FFB74D"), bottom=ft.BorderSide(2, "#FFB74D")),
        width=220
    )
    
    page.add(
        ft.Container(
            content=ft.Column([
                ft.Text("🔐 صفحه ورود", size=22, weight=ft.FontWeight.BOLD, color="#4CAF50"),
                user_card,
                admin_card,
                ft.ElevatedButton("🔙 بازگشت", on_click=lambda e: show_splash(page), bgcolor="#424242", color="white", height=35)
            ], alignment=ft.MainAxisAlignment.CENTER, horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=12),
            expand=True
        )
    )
    page.update()


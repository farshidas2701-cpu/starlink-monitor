# ===== صفحه تغییر رمز عبور =====
# ============================================================
def show_change_password(page):
    page.controls.clear()
    page.bgcolor = "#1a1a2e"
    
    current_pass = ft.TextField(label="رمز فعلی", password=True, can_reveal_password=True, width=300, bgcolor="#2a2a3e", color="white", border_color="#4CAF50", border_radius=10, height=50)
    new_pass = ft.TextField(label="رمز جدید", password=True, can_reveal_password=True, width=300, bgcolor="#2a2a3e", color="white", border_color="#4CAF50", border_radius=10, height=50)
    confirm_pass = ft.TextField(label="تکرار رمز جدید", password=True, can_reveal_password=True, width=300, bgcolor="#2a2a3e", color="white", border_color="#4CAF50", border_radius=10, height=50)
    
    def save_password(e):
        if current_pass.value != user_data["user_pin"]:
            show_toast(page, "❌ رمز فعلی اشتباه است")
            return
        if new_pass.value != confirm_pass.value:
            show_toast(page, "❌ رمز جدید و تکرار آن مطابقت ندارند")
            return
        if len(new_pass.value) < 4:
            show_toast(page, "❌ رمز باید حداقل ۴ کاراکتر باشد")
            return
        user_data["user_pin"] = new_pass.value
        show_toast(page, "✅ رمز عبور با موفقیت تغییر یافت")
        show_dashboard(page, "کاربر ۱", "کاربر")
    
    page.add(
        ft.Container(
            content=ft.Column([
                ft.Text("🔑 تغییر رمز عبور", size=24, weight=ft.FontWeight.BOLD, color="#4CAF50"),
                ft.Text("رمز عبور خود را تغییر دهید", size=14, color="#888888"),
                ft.Container(content=current_pass, padding=10, bgcolor="#2a2a3e", border_radius=12, border=ft.Border(left=ft.BorderSide(2, "#4CAF50"), top=ft.BorderSide(2, "#4CAF50"), right=ft.BorderSide(2, "#4CAF50"), bottom=ft.BorderSide(2, "#4CAF50")), width=350),
                ft.Container(content=new_pass, padding=10, bgcolor="#2a2a3e", border_radius=12, border=ft.Border(left=ft.BorderSide(2, "#4CAF50"), top=ft.BorderSide(2, "#4CAF50"), right=ft.BorderSide(2, "#4CAF50"), bottom=ft.BorderSide(2, "#4CAF50")), width=350),
                ft.Container(content=confirm_pass, padding=10, bgcolor="#2a2a3e", border_radius=12, border=ft.Border(left=ft.BorderSide(2, "#4CAF50"), top=ft.BorderSide(2, "#4CAF50"), right=ft.BorderSide(2, "#4CAF50"), bottom=ft.BorderSide(2, "#4CAF50")), width=350),
                ft.ElevatedButton("✅ ثبت رمز جدید", on_click=save_password, bgcolor="#2E7D32", color="white", width=200, height=45),
                ft.ElevatedButton("🔙 بازگشت", on_click=lambda e: show_dashboard(page, "کاربر ۱", "کاربر"), bgcolor="#424242", color="white", width=200, height=40)
            ], alignment=ft.MainAxisAlignment.CENTER, horizontal_alignment=ft.CrossAxisAlignment.CENTER, spacing=15),
            expand=True
        )
    )
    page.update()

